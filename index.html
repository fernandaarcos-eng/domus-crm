<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domus Rentals — CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ================= LOGIN SCREEN ================= -->
<div class="login-wrap" id="login-screen">
  <div class="login-card">
    <div class="login-logo">Domus<span>Rentals</span></div>
    <div class="login-sub">CRM de administración de arriendos de corta estadía. Inicia sesión con tu cuenta de Domus.</div>

    <form id="login-form">
      <label class="login-label" for="login-email">Correo</label>
      <input class="login-input" type="email" id="login-email" autocomplete="username" required>
      <label class="login-label" for="login-password">Contraseña</label>
      <input class="login-input" type="password" id="login-password" autocomplete="current-password" required>
      <button class="login-btn" type="submit" id="login-submit">Iniciar sesión</button>
      <div class="login-error" id="login-error"></div>
    </form>

    <div class="login-divider">o bien</div>
    <button class="login-demo-btn" id="demo-btn" type="button">Ver demo sin conectar</button>
    <div class="login-demo-note">Modo demo: carga datos de muestra (108 unidades) y guarda solo en este navegador. No se conecta a Supabase.</div>
  </div>
</div>

<!-- ================= APP SHELL ================= -->
<div class="app" id="app">
  <aside class="sidebar">
    <div class="sidebar-logo">Domus<span>Rentals</span></div>
    <nav class="sidebar-nav" id="sidebar-nav">
      <button class="nav-item" data-view="pipeline"><span class="nav-icon">◧</span>Pipeline</button>
      <button class="nav-item" data-view="clientes"><span class="nav-icon">◍</span>Clientes</button>
      <button class="nav-item" data-view="departamentos"><span class="nav-icon">▤</span>Departamentos</button>
      <button class="nav-item" data-view="resumen"><span class="nav-icon">◔</span>Resumen</button>
      <button class="nav-item" data-view="contratos"><span class="nav-icon">📄</span>Contratos y Pagos</button>
      <button class="nav-item" data-view="cotizador"><span class="nav-icon">🧮</span>Cotizador de Amoblados</button>
      <button class="nav-item" data-view="equipo"><span class="nav-icon">✓</span>Equipo y Claves</button>
      <button class="nav-item disabled" data-view="proximamente" title="Generación de contratos, fotografía, alianzas, criterios V4, formularios y propietarios agrupados llegarán en una próxima etapa.">
        <span class="nav-icon">…</span>Próximamente
      </button>
    </nav>
    <div class="sidebar-footer">
      <div class="demo-pill" id="demo-pill" style="display:none;">Modo demo (datos de muestra)</div>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div class="page-title" id="page-title">Pipeline</div>
      <div class="header-right">
        <div class="save-indicator idle" id="save-indicator"><span class="save-dot"></span><span id="save-indicator-text">Sin cambios</span></div>
        <div class="user-chip">
          <div class="user-avatar" id="user-avatar">F</div>
          <span id="user-email-label">—</span>
        </div>
        <button class="btn-logout" id="logout-btn">Cerrar sesión</button>
      </div>
    </header>
    <main class="view-root" id="view-root"></main>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<!-- Scripts (order matters: config/data/api/state first, then views, then app) -->
<script src="config.js"></script>
<script src="data.js"></script>
<script src="api.js"></script>
<script src="state.js"></script>
<script src="app.js"></script>
<script src="view-pipeline.js"></script>
<script src="view-clientes.js"></script>
<script src="view-departamentos.js"></script>
<script src="view-resumen.js"></script>
<script src="view-contratos.js"></script>
<script src="view-cotizador.js"></script>
<script src="view-equipo.js"></script>
</body>
</html>
