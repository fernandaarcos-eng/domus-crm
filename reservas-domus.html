<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservas — Domus Rentals</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f3ef; --surface: #ffffff; --surface2: #f9f8f5; --border: #e5e3dc;
    --text: #1a1916; --text2: #6b6960; --text3: #9e9c94;
    --accent: #7c5cfc; --accent-light: #ede9ff;
    --green: #22c55e; --green-light: #dcfce7;
    --red: #ef4444; --red-light: #fee2e2;
    --amber: #f59e0b; --amber-light: #fef3c7;
    --blue: #3b82f6; --blue-light: #dbeafe;
    --shadow: 0 1px 3px rgba(0,0,0,0.06); --radius: 10px; --radius-sm: 6px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

  /* LOGIN */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 100%; max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,0.08); }
  .login-logo { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .login-logo span { color: var(--accent); }
  .login-sub { font-size: 13px; color: var(--text2); margin-bottom: 32px; }
  .login-label { font-size: 12px; font-weight: 500; color: var(--text2); display: block; margin-bottom: 5px; }
  .login-input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); outline: none; margin-bottom: 14px; transition: border-color 0.15s; }
  .login-input:focus { border-color: var(--accent); }
  .login-btn { width: 100%; padding: 10px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 4px; transition: background 0.15s; }
  .login-btn:hover { background: #6a4de0; }
  .login-error { font-size: 12px; color: var(--red); margin-top: 10px; text-align: center; min-height: 18px; }

  /* APP */
  .app { display: none; flex-direction: column; min-height: 100vh; }
  .app.visible { display: flex; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .logo { font-size: 13px; font-weight: 600; }
  .logo span { color: var(--accent); }
  .divider-v { width: 1px; height: 20px; background: var(--border); }
  .page-title { font-size: 13px; color: var(--text2); }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .user-chip { display: flex; align-items: center; gap: 7px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px 4px 6px; font-size: 12px; font-weight: 500; }
  .user-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-light); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--accent); }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: #6a4de0; }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn-checkin { background: var(--green-light); color: #15803d; border: 1px solid #bbf7d0; }
  .btn-checkin:hover { background: #bbf7d0; }
  .btn-logout { background: transparent; color: var(--text3); border: none; font-size: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; padding: 4px 8px; border-radius: var(--radius-sm); }
  .btn-logout:hover { background: var(--surface2); color: var(--text2); }

  main { padding: 24px; max-width: 1400px; margin: 0 auto; width: 100%; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; box-shadow: var(--shadow); }
  .stat-label { font-size: 11px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .stat-value { font-size: 24px; font-weight: 600; letter-spacing: -0.5px; }
  .stat-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
  .toolbar-left { display: flex; align-items: center; gap: 8px; flex: 1; flex-wrap: wrap; }
  .search-box { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 12px; flex: 1; max-width: 280px; }
  .search-box input { border: none; outline: none; background: transparent; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); width: 100%; }
  .search-box input::placeholder { color: var(--text3); }
  .filter-tabs { display: flex; gap: 4px; }
  .filter-tab { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; background: transparent; color: var(--text2); transition: all 0.15s; font-family: 'DM Sans', sans-serif; }
  .filter-tab.active { background: var(--accent); color: white; }
  .filter-tab:hover:not(.active) { background: var(--surface2); }
  select.filter-select { padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--text2); background: var(--surface); cursor: pointer; outline: none; }

  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead { background: var(--surface2); }
  th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }
  .mono { font-family: 'DM Mono', monospace; font-size: 12px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .badge-green { background: var(--green-light); color: #15803d; }
  .badge-red { background: var(--red-light); color: #dc2626; }
  .badge-amber { background: var(--amber-light); color: #b45309; }
  .badge-blue { background: var(--blue-light); color: #1d4ed8; }
  .badge-gray { background: #f1f0eb; color: var(--text2); }
  .badge-purple { background: var(--accent-light); color: var(--accent); }
  .platform { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--text2); }
  .platform-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .p-airbnb { background: #ff5a5f; } .p-booking { background: #003580; } .p-expedia { background: #f59e0b; } .p-otro { background: var(--text3); }
  .check-row { display: flex; gap: 3px; flex-wrap: wrap; }
  .check-pill { font-size: 10px; padding: 2px 5px; border-radius: 4px; font-weight: 500; white-space: nowrap; }
  .check-ok { background: var(--green-light); color: #15803d; }
  .check-no { background: #f1f0eb; color: var(--text3); }
  .action-btn { padding: 4px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: transparent; cursor: pointer; font-size: 11px; color: var(--text2); font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .action-btn:hover { background: var(--surface2); color: var(--text); }
  .empty { text-align: center; padding: 48px 24px; color: var(--text3); }
  .empty-title { font-size: 14px; font-weight: 500; color: var(--text2); margin-bottom: 6px; }
  .pagination { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text3); }
  .page-btns { display: flex; gap: 4px; }
  .page-btn { padding: 4px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: transparent; cursor: pointer; font-size: 12px; font-family: 'DM Sans', sans-serif; color: var(--text2); transition: all 0.15s; }
  .page-btn:hover { background: var(--surface2); }
  .page-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

  /* MODAL GENÉRICO */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 24px; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 580px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); transform: translateY(12px); transition: transform 0.2s; max-height: 90vh; overflow-y: auto; }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-size: 15px; font-weight: 600; }
  .modal-close { width: 28px; height: 28px; border-radius: 6px; border: none; background: var(--surface2); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; color: var(--text2); transition: all 0.15s; }
  .modal-close:hover { background: var(--border); }
  .modal-body { padding: 20px 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 12px; font-weight: 500; color: var(--text2); }
  input, select, textarea { padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); background: var(--surface); outline: none; transition: border-color 0.15s; width: 100%; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 64px; }
  .form-section { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin: 16px 0 10px; }
  .checks-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .check-toggle { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s; background: var(--surface2); }
  .check-toggle.checked { border-color: var(--green); background: var(--green-light); }
  .check-toggle span { font-size: 11px; font-weight: 500; color: var(--text2); text-align: center; }
  .check-toggle.checked span { color: #15803d; }
  .check-toggle .toggle-icon { font-size: 16px; }

  /* VISTA CHECK-IN DEL DÍA */
  .checkin-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .checkin-overlay.open { opacity: 1; pointer-events: all; }
  .checkin-panel { background: var(--surface); width: 100%; max-width: 720px; max-height: 90vh; border-radius: 16px 16px 0 0; overflow-y: auto; transform: translateY(40px); transition: transform 0.25s; }
  .checkin-overlay.open .checkin-panel { transform: translateY(0); }
  .checkin-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .checkin-title { display: flex; flex-direction: column; gap: 3px; }
  .checkin-title h2 { font-size: 16px; font-weight: 600; }
  .checkin-title p { font-size: 12px; color: var(--text2); }
  .checkin-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
  .checkin-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .checkin-card-header { padding: 14px 18px; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .checkin-prop { font-size: 15px; font-weight: 600; }
  .checkin-card-body { padding: 16px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .checkin-field { display: flex; flex-direction: column; gap: 3px; }
  .checkin-field-label { font-size: 11px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px; }
  .checkin-field-value { font-size: 13px; font-weight: 500; }
  .checkin-registros { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .checkin-registros-label { font-size: 11px; color: var(--text3); font-weight: 500; margin-right: 4px; }
  .checkin-notas { padding: 10px 18px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text2); background: var(--amber-light); }
  .checkin-empty { text-align: center; padding: 48px 24px; color: var(--text3); }

  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--text); color: white; padding: 10px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; transform: translateY(60px); opacity: 0; transition: all 0.25s; z-index: 400; }
  .toast.show { transform: translateY(0); opacity: 1; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="login-logo">Domus <span>Rentals</span></div>
    <div class="login-sub">Departamento de Reservas — Ingresa con tu cuenta</div>
    <label class="login-label">Usuario</label>
    <input class="login-input" type="text" id="loginUser" placeholder="tu nombre" autocomplete="username">
    <label class="login-label">Contraseña</label>
    <input class="login-input" type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()">Ingresar</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <header>
    <div class="header-left">
      <div class="logo">Domus <span>Rentals</span></div>
      <div class="divider-v"></div>
      <div class="page-title">Reservas</div>
    </div>
    <div class="header-right">
      <button class="btn btn-checkin" onclick="abrirCheckins()">✓ Mis check ins de hoy</button>
      <button class="btn btn-primary" onclick="abrirModal()">+ Nueva Reserva</button>
      <div class="user-chip">
        <div class="user-avatar" id="userAvatar"></div>
        <span id="userName"></span>
      </div>
      <button class="btn-logout" onclick="doLogout()">Salir</button>
    </div>
  </header>

  <main>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search-box">
          <span style="color:var(--text3);font-size:15px">⌕</span>
          <input type="text" id="searchInput" placeholder="Buscar pasajero, propiedad, N° reserva..." oninput="filtrar()">
        </div>
        <div class="filter-tabs">
          <button class="filter-tab active" onclick="setEstadia('todos', this)">Todos</button>
          <button class="filter-tab" onclick="setEstadia('En Curso', this)">En Curso</button>
          <button class="filter-tab" onclick="setEstadia('Futura', this)">Futuras</button>
          <button class="filter-tab" onclick="setEstadia('Finalizada', this)">Finalizadas</button>
        </div>
        <select class="filter-select" id="filterPlataforma" onchange="filtrar()">
          <option value="">Todas las plataformas</option>
          <option value="Airbnb">Airbnb</option>
          <option value="Booking">Booking</option>
          <option value="Expedia">Expedia</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <div style="font-size:12px;color:var(--text3)" id="conteo"></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Check In</th><th>Check Out</th><th>Noch.</th>
            <th>Plataforma</th><th>N° Reserva</th>
            <th>Pasajero</th><th>Propiedad</th>
            <th>Estadía</th><th>Pago</th><th>Total</th>
            <th>Registros</th><th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="pagination" id="pagination"></div>
    </div>
  </main>
</div>

<!-- MODAL NUEVA/EDITAR RESERVA -->
<div class="modal-overlay" id="modalOverlay" onclick="cerrarModalOverlay(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Nueva Reserva</div>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group">
          <label>Check In *</label>
          <input type="date" id="f_checkin">
        </div>
        <div class="form-group">
          <label>Check Out *</label>
          <input type="date" id="f_checkout">
        </div>
        <div class="form-group">
          <label>Plataforma *</label>
          <select id="f_plataforma">
            <option value="">Seleccionar</option>
            <option value="Airbnb">Airbnb</option>
            <option value="Booking">Booking</option>
            <option value="Expedia">Expedia</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label>N° Reserva *</label>
          <input type="text" id="f_nro" placeholder="Ej: 5408095203">
        </div>
        <div class="form-group full">
          <label>Pasajero *</label>
          <input type="text" id="f_pasajero" placeholder="Nombre completo">
        </div>
        <div class="form-group">
          <label>Propiedad *</label>
          <input type="text" id="f_propiedad" placeholder="Ej: 503, 824, 1006">
        </div>
        <div class="form-group">
          <label>Total (USD)</label>
          <input type="number" id="f_total" placeholder="0.00" step="0.01">
        </div>
        <div class="form-group">
          <label>Pago</label>
          <select id="f_pago">
            <option value="">Pendiente</option>
            <option value="OK">OK</option>
          </select>
        </div>
      </div>
      <div class="form-section" id="secRegistros" style="display:none">Registros en sistemas</div>
      <div class="checks-grid" id="gridRegistros" style="display:none">
        <label class="check-toggle" id="t_aseo" onclick="toggleCheck('aseo')">
          <span class="toggle-icon">🧹</span><span>Aseo</span>
        </label>
        <label class="check-toggle" id="t_airtable" onclick="toggleCheck('airtable')">
          <span class="toggle-icon">🗄️</span><span>Airtable</span>
        </label>
        <label class="check-toggle" id="t_airbnb" onclick="toggleCheck('airbnb')">
          <span class="toggle-icon">🏠</span><span>Airbnb</span>
        </label>
        <label class="check-toggle" id="t_expedia" onclick="toggleCheck('expedia')">
          <span class="toggle-icon">✈️</span><span>Expedia</span>
        </label>
        <label class="check-toggle" id="t_info_prop" onclick="toggleCheck('info_prop')">
          <span class="toggle-icon">👤</span><span>Info Prop.</span>
        </label>
        <label class="check-toggle" id="t_buscador" onclick="toggleCheck('buscador')">
          <span class="toggle-icon">🔍</span><span>Buscador</span>
        </label>
      </div>
      <div class="form-group full" style="margin-top:14px">
        <label>Notas</label>
        <textarea id="f_notas" placeholder="Observaciones, hora de llegada, instrucciones especiales..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarReserva()">Guardar Reserva</button>
    </div>
  </div>
</div>

<!-- PANEL CHECK INS DEL DÍA -->
<div class="checkin-overlay" id="checkinOverlay" onclick="cerrarCheckinOverlay(event)">
  <div class="checkin-panel">
    <div class="checkin-header">
      <div class="checkin-title">
        <h2>✓ Mis check ins de hoy</h2>
        <p id="checkinFecha"></p>
      </div>
      <button class="modal-close" onclick="cerrarCheckins()">✕</button>
    </div>
    <div class="checkin-body" id="checkinBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── USUARIOS ─────────────────────────────────────────
const USUARIOS = {

  'fabian':  { pass: 'domus2026', nombre: 'Fabián',  admin: false },
  'nico':    { pass: 'domus2026', nombre: 'Nico',     admin: false },
  'tomas':   { pass: 'domus2026', nombre: 'Tomas',    admin: true  },
};

const SHEET_URL = 'https://script.google.com/macros/s/AKfycbw96a5JY4uDnfd8ViTDGDAa97RCnSn62GAnVrOPnuivENXgOOMyoka348fYJctdFz_U/exec';

let reservas = [];
let cargando = false;
let usuarioActual = null;
let editandoId = null;

async function cargarReservas() {
  try {
    const resp = await fetch(SHEET_URL + '?action=get');
    const data = await resp.json();
    if (Array.isArray(data) && data.length > 0) {
      reservas = data.map(function(r) {
        return {
          id: parseInt(r.id) || Date.now(),
          checkin: r.checkin || '',
          checkout: r.checkout || '',
          plataforma: r.plataforma || '',
          nro: String(r.nro || ''),
          pasajero: r.pasajero || '',
          propiedad: String(r.propiedad || ''),
          telefono: r.telefono || '',
          total: parseFloat(r.total) || 0,
          pago: r.pago || '',
          agente: r.agente || '',
          aseo: r.aseo === true || r.aseo === 'true',
          airtable: r.airtable === true || r.airtable === 'true',
          airbnb: r.airbnb === true || r.airbnb === 'true',
          expedia: r.expedia === true || r.expedia === 'true',
          info_prop: r.info_prop === true || r.info_prop === 'true',
          buscador: r.buscador === true || r.buscador === 'true',
          notas: r.notas || '',
        };
      });
    } else {
      // Primera vez — cargar datos iniciales y guardar en Sheets
      reservas = DATOS_INICIALES;
      await fetch(SHEET_URL, {
        method: 'POST',
        body: JSON.stringify({action: 'save', reservas: reservas})
      });
    }
  } catch(e) {
    console.error('Error cargando Sheets, usando datos locales:', e);
    reservas = DATOS_INICIALES;
  }
  if (usuarioActual) { filtrar(); renderStats(); }
}

function guardarLocal() {
  fetch(SHEET_URL, {
    method: 'POST',
    body: JSON.stringify({action: 'save', reservas: reservas})
  }).catch(e => console.error('Error guardando:', e));
}

// ─── AUTH ─────────────────────────────────────────────
function doLogin() {
  const user = document.getElementById('loginUser').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  if (USUARIOS[user] && USUARIOS[user].pass === pass) {
    usuarioActual = { key: user, ...USUARIOS[user] };
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(usuarioActual));
    mostrarApp();
  } else {
    err.textContent = 'Usuario o contraseña incorrectos';
    setTimeout(() => err.textContent = '', 3000);
  }
}

function doLogout() {
  sessionStorage.removeItem(SESSION_KEY);
  usuarioActual = null;
  document.getElementById('app').classList.remove('visible');
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
}

function mostrarApp() {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  const ini = usuarioActual.nombre[0].toUpperCase();
  document.getElementById('userAvatar').textContent = ini;
  document.getElementById('userName').textContent = usuarioActual.nombre;
  // Mostrar registros solo para admin
  const esAdmin = usuarioActual.admin;
  document.getElementById('secRegistros').style.display = esAdmin ? '' : 'none';
  document.getElementById('gridRegistros').style.display = esAdmin ? 'grid' : 'none';
  cargarReservas();
}

// Restaurar sesión
const sesion = sessionStorage.getItem(SESSION_KEY);
if (sesion) { usuarioActual = JSON.parse(sesion); mostrarApp(); }

// Enter en login
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('loginUser').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('loginPass').focus(); });

// ─── HELPERS ──────────────────────────────────────────
function calcEstadia(ci, co) {
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const a = new Date(ci+'T00:00:00'), b = new Date(co+'T00:00:00');
  if (b <= hoy) return 'Finalizada';
  if (a <= hoy && b > hoy) return 'En Curso';
  return 'Futura';
}
function calcNoches(ci, co) { return Math.round((new Date(co+'T00:00:00') - new Date(ci+'T00:00:00')) / 86400000); }
function fmtFecha(iso) {
  if (!iso) return '';
  const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const parts = iso.split('-');
  return parseInt(parts[2]) + ' ' + meses[parseInt(parts[1])-1] + ' ' + parts[0];
}
function platColor(p) { return {Airbnb:'p-airbnb',Booking:'p-booking',Expedia:'p-expedia'}[p]||'p-otro'; }
function misReservas() {
  if (usuarioActual.admin) return reservas;
  return reservas.filter(r => r.agente === usuarioActual.key);
}

// ─── STATS ────────────────────────────────────────────
function renderStats() {
  const mias = misReservas();
  const enCurso = mias.filter(r => calcEstadia(r.checkin, r.checkout) === 'En Curso').length;
  const futuras = mias.filter(r => calcEstadia(r.checkin, r.checkout) === 'Futura').length;
  const total = mias.reduce((s,r) => s+(r.total||0), 0);
  const sinPago = mias.filter(r => r.pago !== 'OK' && calcEstadia(r.checkin,r.checkout) !== 'Finalizada').length;
  const hoy = new Date().toISOString().split('T')[0];
  const checkins = mias.filter(r => r.checkin === hoy).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="stat-label">Check ins hoy</div><div class="stat-value" style="color:var(--green)">${checkins}</div><div class="stat-sub">Llegadas para hoy</div></div>
    <div class="stat-card"><div class="stat-label">En Curso</div><div class="stat-value" style="color:var(--blue)">${enCurso}</div><div class="stat-sub">Estadías activas</div></div>
    <div class="stat-card"><div class="stat-label">Futuras</div><div class="stat-value" style="color:var(--accent)">${futuras}</div><div class="stat-sub">Próximas reservas</div></div>
    <div class="stat-card"><div class="stat-label">Pago pendiente</div><div class="stat-value" style="color:${sinPago>0?'var(--amber)':'var(--green)'}">${sinPago}</div><div class="stat-sub">Sin confirmar</div></div>
  `;
}

// ─── FILTROS ──────────────────────────────────────────
function setEstadia(val, el) {
  filtroEstadiaActual = val;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  paginaActual = 1; filtrar();
}

function filtrar() {
  if (!usuarioActual) return;
  const q = document.getElementById('searchInput').value.toLowerCase();
  const plat = document.getElementById('filterPlataforma').value;
  let result = misReservas().filter(r => {
    const est = calcEstadia(r.checkin, r.checkout);
    if (filtroEstadiaActual !== 'todos' && est !== filtroEstadiaActual) return false;
    if (plat && r.plataforma !== plat) return false;
    if (q && ![r.pasajero,r.propiedad,r.nro].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
  result.sort((a,b) => new Date(a.checkin)-new Date(b.checkin));
  renderTabla(result);
  renderStats();
}

// ─── TABLA ────────────────────────────────────────────
function renderTabla(data) {
  const total = data.length;
  const inicio = (paginaActual-1)*POR_PAGINA;
  const pagina = data.slice(inicio, inicio+POR_PAGINA);
  document.getElementById('conteo').textContent = `${total} reserva${total!==1?'s':''}`;
  const LABS = ['Aseo','Airtable','Airbnb','Expedia','Info P.','Busc.'];
  const KEYS = ['aseo','airtable','airbnb','expedia','info_prop','buscador'];
  const estBadge = {'En Curso':'badge-green','Futura':'badge-blue','Finalizada':'badge-gray'};
  const esAdmin = usuarioActual.admin;
  // Actualizar headers según rol
  const thead = document.querySelector('thead tr');
  thead.innerHTML = `
    <th>Check In</th><th>Check Out</th><th>Noch.</th>
    <th>Plataforma</th><th>N° Reserva</th>
    <th>Pasajero</th><th>Propiedad</th>
    <th>Estadía</th><th>Pago</th><th>Total</th>
    ${esAdmin ? '<th>Registros</th><th>Agente</th>' : ''}
    <th></th>
  `;
  const tbody = document.getElementById('tableBody');
  if (!pagina.length) {
    tbody.innerHTML = `<tr><td colspan="${esAdmin?13:11}"><div class="empty"><div class="empty-title">Sin resultados</div><div>Ajusta los filtros o agrega una nueva reserva</div></div></td></tr>`;
  } else {
    tbody.innerHTML = pagina.map(r => {
      const est = calcEstadia(r.checkin, r.checkout);
      return `<tr>
        <td><span class="mono">${fmtFecha(r.checkin)}</span></td>
        <td><span class="mono">${fmtFecha(r.checkout)}</span></td>
        <td style="color:var(--text2)">${calcNoches(r.checkin,r.checkout)}n</td>
        <td><div class="platform"><span class="platform-dot ${platColor(r.plataforma)}"></span>${r.plataforma}</div></td>
        <td><span class="mono" style="color:var(--text2)">${r.nro}</span></td>
        <td style="font-weight:500">${r.pasajero}</td>
        <td><span class="badge badge-gray">Dpto ${r.propiedad}</span></td>
        <td><span class="badge ${estBadge[est]||'badge-gray'}">${est}</span></td>
        <td><span class="badge ${r.pago==='OK'?'badge-green':'badge-amber'}">${r.pago||'Pendiente'}</span></td>
        <td style="font-weight:500">$${(r.total||0).toFixed(2)}</td>
        ${esAdmin ? `
        <td><div class="check-row">${KEYS.map((k,i)=>`<span class="check-pill ${r[k]?'check-ok':'check-no'}">${LABS[i]}</span>`).join('')}</div></td>
        <td style="color:var(--text2);font-size:12px">${USUARIOS[r.agente]?.nombre||r.agente||'—'}</td>` : ''}
        <td><div style="display:flex;gap:4px">
          <button class="action-btn" onclick="editarReserva(${r.id})">Editar</button>
          <button class="action-btn" onclick="eliminarReserva(${r.id})" style="color:var(--red)">✕</button>
        </div></td>
      </tr>`;
    }).join('');
  }
  const totalPags = Math.ceil(total/POR_PAGINA);
  const pag = document.getElementById('pagination');
  if (totalPags <= 1) { pag.innerHTML=''; return; }
  let btns = '';
  for (let i=1;i<=totalPags;i++) btns+=`<button class="page-btn ${i===paginaActual?'active':''}" onclick="irPagina(${i})">${i}</button>`;
  pag.innerHTML = `<span>${inicio+1}–${Math.min(inicio+POR_PAGINA,total)} de ${total}</span><div class="page-btns">${btns}</div>`;
}

function irPagina(n) { paginaActual=n; filtrar(); }

// ─── CHECK INS DEL DÍA ────────────────────────────────
function abrirCheckins() {
  const hoy = new Date().toISOString().split('T')[0];
  const fechaStr = new Date().toLocaleDateString('es-CL', {weekday:'long',year:'numeric',month:'long',day:'numeric'});
  document.getElementById('checkinFecha').textContent = fechaStr.charAt(0).toUpperCase()+fechaStr.slice(1);
  const mias = misReservas().filter(r => r.checkin === hoy);
  const LABS = ['Aseo','Airtable','Airbnb','Expedia','Info P.','Busc.'];
  const KEYS = ['aseo','airtable','airbnb','expedia','info_prop','buscador'];
  const body = document.getElementById('checkinBody');
  if (!mias.length) {
    body.innerHTML = `<div class="checkin-empty"><div style="font-size:32px;margin-bottom:12px">🎉</div><div style="font-size:15px;font-weight:500;color:var(--text2);margin-bottom:6px">Sin check ins hoy</div><div>No tienes llegadas programadas para hoy.</div></div>`;
  } else {
    body.innerHTML = mias.map(r => `
      <div class="checkin-card">
        <div class="checkin-card-header">
          <div>
            <div class="checkin-prop">Dpto ${r.propiedad}</div>
            <div style="font-size:12px;color:var(--text2);margin-top:2px">${r.pasajero}</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <div class="platform"><span class="platform-dot ${platColor(r.plataforma)}"></span>${r.plataforma}</div>
            <span class="badge badge-green">Check in hoy</span>
          </div>
        </div>
        <div class="checkin-card-body">
          <div class="checkin-field">
            <div class="checkin-field-label">Check In</div>
            <div class="checkin-field-value">${fmtFecha(r.checkin)}</div>
          </div>
          <div class="checkin-field">
            <div class="checkin-field-label">Check Out</div>
            <div class="checkin-field-value">${fmtFecha(r.checkout)}</div>
          </div>
          <div class="checkin-field">
            <div class="checkin-field-label">Noches</div>
            <div class="checkin-field-value">${calcNoches(r.checkin,r.checkout)}</div>
          </div>
          <div class="checkin-field">
            <div class="checkin-field-label">N° Reserva</div>
            <div class="checkin-field-value mono">${r.nro}</div>
          </div>
          <div class="checkin-field">
            <div class="checkin-field-label">Total</div>
            <div class="checkin-field-value">$${(r.total||0).toFixed(2)} USD</div>
          </div>
          <div class="checkin-field">
            <div class="checkin-field-label">Pago</div>
            <div class="checkin-field-value"><span class="badge ${r.pago==='OK'?'badge-green':'badge-amber'}">${r.pago||'Pendiente'}</span></div>
          </div>
        </div>
        <div class="checkin-registros">
          <span class="checkin-registros-label">Registros:</span>
          ${KEYS.map((k,i)=>`<span class="check-pill ${r[k]?'check-ok':'check-no'}">${LABS[i]}</span>`).join('')}
        </div>
        ${r.notas?`<div class="checkin-notas">📝 ${r.notas}</div>`:''}
      </div>
    `).join('');
  }
  document.getElementById('checkinOverlay').classList.add('open');
}

function cerrarCheckins() { document.getElementById('checkinOverlay').classList.remove('open'); }
function cerrarCheckinOverlay(e) { if (e.target===document.getElementById('checkinOverlay')) cerrarCheckins(); }

// ─── MODAL ────────────────────────────────────────────
function abrirModal(id=null) {
  editandoId = id; limpiarForm();
  if (id) {
    const r = reservas.find(x=>x.id===id);
    if(!r) return;
    document.getElementById('modalTitle').textContent = 'Editar Reserva';
    document.getElementById('f_checkin').value = r.checkin;
    document.getElementById('f_checkout').value = r.checkout;
    document.getElementById('f_plataforma').value = r.plataforma;
    document.getElementById('f_nro').value = r.nro;
    document.getElementById('f_pasajero').value = r.pasajero;
    document.getElementById('f_propiedad').value = r.propiedad;
    document.getElementById('f_total').value = r.total||'';
    document.getElementById('f_pago').value = r.pago||'';
    document.getElementById('f_notas').value = r.notas||'';
    ['aseo','airtable','airbnb','expedia','info_prop','buscador'].forEach(k => {
      checks[k]=r[k]||false;
      document.getElementById('t_'+k).classList.toggle('checked', r[k]);
    });
  } else {
    document.getElementById('modalTitle').textContent = 'Nueva Reserva';
  }
  document.getElementById('modalOverlay').classList.add('open');
}

function cerrarModal() { document.getElementById('modalOverlay').classList.remove('open'); editandoId=null; }
function cerrarModalOverlay(e) { if(e.target===document.getElementById('modalOverlay')) cerrarModal(); }

function limpiarForm() {
  ['f_checkin','f_checkout','f_nro','f_pasajero','f_propiedad','f_total','f_notas'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f_plataforma').value='';
  document.getElementById('f_pago').value='';
  Object.keys(checks).forEach(k=>{checks[k]=false;document.getElementById('t_'+k).classList.remove('checked');});
}

function toggleCheck(key) {
  checks[key]=!checks[key];
  document.getElementById('t_'+key).classList.toggle('checked',checks[key]);
}

function guardarReserva() {
  const ci=document.getElementById('f_checkin').value;
  const co=document.getElementById('f_checkout').value;
  const nro=document.getElementById('f_nro').value.trim();
  const pas=document.getElementById('f_pasajero').value.trim();
  const prop=document.getElementById('f_propiedad').value.trim();
  const plat=document.getElementById('f_plataforma').value;
  if (!ci||!co||!nro||!pas||!prop||!plat) { mostrarToast('⚠️ Completa los campos obligatorios'); return; }
  if (new Date(co)<=new Date(ci)) { mostrarToast('⚠️ Check Out debe ser posterior al Check In'); return; }
  const obj = {
    id: editandoId||Date.now(),
    checkin:ci, checkout:co, plataforma:plat, nro,
    pasajero:pas, propiedad:prop,
    total: parseFloat(document.getElementById('f_total').value)||0,
    pago: document.getElementById('f_pago').value,
    agente: usuarioActual.key,
    notas: document.getElementById('f_notas').value.trim(),
    ...Object.fromEntries(Object.entries(checks)),
  };
  if (editandoId) {
    const idx=reservas.findIndex(r=>r.id===editandoId);
    reservas[idx]=obj;
    mostrarToast('✓ Reserva actualizada');
  } else {
    reservas.unshift(obj);
    mostrarToast('✓ Reserva registrada');
  }
  guardarLocal(); cerrarModal(); filtrar();
}

function editarReserva(id) { abrirModal(id); }
function eliminarReserva(id) {
  if (!confirm('¿Eliminar esta reserva?')) return;
  reservas=reservas.filter(r=>r.id!==id);
  guardarLocal(); filtrar(); mostrarToast('Reserva eliminada');
}

function mostrarToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
